# Publica o site com uma prévia (WhatsApp, Instagram, Google) para cada evento.
# Roda a cada 10 minutos, a cada mudança no main e quando você clica em "Run workflow".
name: Publicar site com prévias

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# O robô só lê o código; o que ele publica vai pela chave do Firebase.
permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chave do Firebase
        env:
          CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT no GitHub"; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"
      - name: Cadastrar eventos novos (pasta eventos-novos)
        run: npm run importar
      - name: Tirar contato de quem enviou dos eventos publicados
        run: npm run limpar-contatos
        continue-on-error: true
      - run: npm run previas
      - name: Publicar no Firebase Hosting
        run: npx -y firebase-tools@14.27.0 deploy --only hosting --project oquevairolar-b0129 --non-interactive
      - name: Contar Eu vou, rostos e acessos dos eventos
        run: npm run contagens
        continue-on-error: true
      - name: Enviar lembretes no celular
        run: npm run lembretes
        continue-on-error: true
      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"
